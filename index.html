<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የእኔ ሱቅ</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
    }

    nav {
      margin-top: 10px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
    }

    .hero {
      background: white;
      padding: 40px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 30px 15px;
    }

    .product {
      background: white;
      width: 250px;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .product .photo {
      height: 160px;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 50px;
    }

    .product h3 {
      margin: 15px 0 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }
  </style>
</head>

<body>

  <header>
    <h1>🛍️ የእኔ ሱቅ</h1>
    <nav>
      <a href="#">መነሻ</a>
      <a href="#products">ምርቶች</a>
      <a href="#contact">አግኙን</a>
    </nav>
  </header>

  <section class="hero">
    <h2>እንኳን ወደ ሱቃችን በደህና መጡ!</h2>
    <p>ጥራት ያላቸውን ምርቶች በተመጣጣኝ ዋጋ ያግኙ።</p>
  </section>

  <section class="products" id="products">

    <div class="product">
      <div class="photo">👕</div>
      <h3>ልብስ</h3>
      <p>ጥራት ያለው ልብስ</p>
      <div class="price">500 ብር</div>
      <button>ይግዙ</button>
    </div>

    <div class="product">
      <div class="photo">👟</div>
      <h3>ጫማ</h3>
      <p>ዘመናዊ ጫማ</p>
      <div class="price">1,200 ብር</div>
      <button>ይግዙ</button>
    </div>

    <div class="product">
      <div class="photo">🎒</div>
      <h3>ቦርሳ</h3>
      <p>ጠንካራ እና ዘመናዊ</p>
      <div class="price">800 ብር</div>
      <button>ይግዙ</button>
    </div>

  </section>

  <footer id="contact">
    <p>📞 ስልክ: 09XXXXXXXX</p>
    <p>© 2026 የእኔ ሱቅ</p>
  </footer>

</body>
</html>
